<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        let saved = '';
        try { saved = localStorage.getItem('builtin-ai:theme') || ''; } catch { /* ignore */ }
        document.documentElement.dataset.theme = saved === 'dark' ? 'dark' : 'light';
      })();
    </script>
    <title>Presenter · Built-In AI in the Browser</title>
  </head>
  <body>
    <div class="presenter-app"></div>
    <script type="module" src="/presenter/main.ts"></script>
  </body>
</html>
